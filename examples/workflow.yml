name: Deploy with circuit breaker protection

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call flaky deploy API
        id: breaker
        uses: kennethonyenuloya/retry-storm-breaker@v1
        with:
          key: staging-deploy-api
          run: curl -sf https://staging-deploy.example.com/trigger
          failure-threshold: 5
          window-size: 10
          open-duration-seconds: 300
          half-open-max-calls: 1
        continue-on-error: true

      - name: Notify Slack when breaker trips
        if: steps.breaker.outputs.circuit-state == 'open'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: "🔴 Circuit breaker OPEN for staging-deploy-api — deploys are being skipped until the dependency recovers."

      - name: Fail the job if the underlying call failed
        if: steps.breaker.outputs.outcome != 'success'
        run: exit 1
