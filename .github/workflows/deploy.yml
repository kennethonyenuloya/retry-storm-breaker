name: Deploy with circuit breaker protection

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test successful request
        id: success
        uses: kennethonyenuloya/retry-storm-breaker@v1
        with:
          key: test-success
          run: curl -fsS https://httpbingo.org/get
        continue-on-error: true

      - name: Test failed request
        id: failure
        uses: kennethonyenuloya/retry-storm-breaker@v1
        with:
          key: test-failure
          run: curl -sf https://httpbin.org/status/500
          failure-threshold: 1 # 5 for production, but we want to trip the breaker quickly for testing
          window-size: 1 # 10 for production, but we want to trip the breaker quickly for testing
          open-duration-seconds: 10 # 300
          half-open-max-calls: 1
        continue-on-error: true

      - name: Call flaky deploy API
        id: breaker
        uses: kennethonyenuloya/retry-storm-breaker@v1
        with:
          key: staging-deploy-api
          run: curl -sf https://staging-deploy.example.com/trigger
          failure-threshold: 1 # 5 for production, but we want to trip the breaker quickly for testing
          window-size: 1 # 10 for production, but we want to trip the breaker quickly for testing
          open-duration-seconds: 10 # 300 is recommended for production, use a longer duration for real-world scenarios that require more time to recover such as a database outage or a third-party service outage.
          half-open-max-calls: 1
        continue-on-error: true

      - name: Notify Slack when breaker trips
        if: steps.breaker.outputs.circuit-state == 'open'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: "🔴 Circuit breaker OPEN for staging-deploy-api — deploys are being skipped until the dependency recovers."

      # - name: Fail the job if the underlying call failed
      #   if: steps.breaker.outputs.outcome != 'success'
      #   run: exit 1

      - name: Show results
        run: |
          echo "Success outcome: ${{ steps.success.outputs.outcome }}"
          echo "Failure outcome: ${{ steps.failure.outputs.outcome }}"
          echo "Failure circuit: ${{ steps.failure.outputs.circuit-state }}"
          echo "Breaker (staging-deploy-api) outcome: ${{ steps.breaker.outputs.outcome }}"
          echo "Breaker (staging-deploy-api) circuit: ${{ steps.breaker.outputs.circuit-state }}"
